name: CI

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  test:
    name: Package Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["macOS", "ubuntu", "iOS"]
        swift: ["6.4.1"]
        include:
          - platform: macOS
            os: macOS-latest
          - platform: ubuntu
            os: ubuntu-latest
          - platform: iOS
            os: xcode-27
            destination: 'platform=iOS Simulator,OS=27.1,name=iPhone Duo'
            xcode-version: '27.1' # Need to match Xcode version to iOS + Swift version
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Swift
      if : ${{ matrix.platform != 'iOS' }}
      uses: swift-actions/setup-swift@v3.0.0-beta.1
      with:
        swift-version: "${{ matrix.swift }}"
        skip-verify-signature: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Setup Xcode
      if : ${{ matrix.platform == 'iOS' }}
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: ${{ matrix.xcode-version }}
    - name: Configure SwiftLint Reporter
      run: 'echo "reporter: \"github-actions-logging\"" >> .swiftlint.yml'
    - name: Run tests
      if : ${{ matrix.platform != 'iOS' }}
      run: |
        for attempt in 1 2; do
          if swift test --build-system swiftbuild --enable-code-coverage; then
            break
          fi

          if [[ "$attempt" -eq 1 ]]; then
            echo "${{ matrix.platform }} package tests failed; retrying once..." >&2
          else
            exit 1
          fi
        done
    - name: Run iOS tests
      id: ios-tests
      if : ${{ matrix.platform == 'iOS' }}
      run: |
        mkdir -p ../DerivedData
        DERIVED_DATA_PATH=$PWD/../DerivedData
        echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> $GITHUB_ENV
        APP_PROJECT_BACKUP_DIR=$(mktemp -d)
        APP_PROJECT_BACKUP_PATH="$APP_PROJECT_BACKUP_DIR/SwiftBeanCountApp.xcodeproj"
        mv SwiftBeanCountApp.xcodeproj "$APP_PROJECT_BACKUP_PATH"
        restore_app_project() {
          mv "$APP_PROJECT_BACKUP_PATH" SwiftBeanCountApp.xcodeproj
        }
        trap restore_app_project EXIT
        SCHEME=$(xcodebuild test -list -json | jq -r "if .workspace.schemes | length == 1 then .workspace.schemes.[0] else .workspace.schemes | map(select(.|endswith(\"-Package\"))) | .[0] end")
        for attempt in 1 2; do
          if xcodebuild test -skipPackagePluginValidation -enableCodeCoverage YES -scheme "$SCHEME" -destination "${{ matrix.destination }}" -derivedDataPath "$DERIVED_DATA_PATH"; then
            break
          fi

          if [[ "$attempt" -eq 1 ]]; then
            echo "iOS package tests failed; retrying once..." >&2
          else
            exit 1
          fi
        done
    - name: Install lcov
      if: ${{ matrix.platform != 'ubuntu' }}
      run: brew install lcov
    - name: Install lcov on Ubuntu
      if: ${{ matrix.platform == 'ubuntu' }}
      run: sudo apt-get update && sudo apt-get install -y lcov
    - name: Create coverage directory
      run: |
        mkdir -p ./${{matrix.platform}}-coverage
        echo "${{ github.event.number }}" > "./${{matrix.platform}}-coverage/PR_NUMBER-${{matrix.platform}}"
    - name: Determine llvm command
      run: |
        if [[ "${{matrix.platform}}" == "iOS" ]]; then
          LLVM_COV_CMD="xcrun llvm-cov"
          LLVM_PROFDATA_CMD="xcrun llvm-profdata"
        else
          SWIFT_TOOLCHAIN_PATH="$(swiftly use --print-location)"
          LLVM_COV_CMD="${SWIFT_TOOLCHAIN_PATH}/usr/bin/llvm-cov"
          LLVM_PROFDATA_CMD="${SWIFT_TOOLCHAIN_PATH}/usr/bin/llvm-profdata"
          if [[ ! -x "${LLVM_COV_CMD}" || ! -x "${LLVM_PROFDATA_CMD}" ]]; then
            echo "Could not find LLVM coverage tools in the selected Swift toolchain: ${SWIFT_TOOLCHAIN_PATH}" >&2
            exit 1
          fi
        fi

        echo "Using coverage tool: ${LLVM_COV_CMD}"
        ${LLVM_COV_CMD} --version
        echo "LLVM_COV_CMD=${LLVM_COV_CMD}" >> ${GITHUB_ENV}
        echo "LLVM_PROFDATA_CMD=${LLVM_PROFDATA_CMD}" >> ${GITHUB_ENV}
        echo "LLVM_COV_ARGS=--skip-functions --skip-branches --ignore-filename-regex=.build|Tests|SourcePackages --format=lcov" >> ${GITHUB_ENV}
        echo "OUTPUT_FILE=${{matrix.platform}}-coverage/${{matrix.platform}}.info" >> ${GITHUB_ENV}
    - name: Generate test coverage report
      if: ${{ matrix.platform != 'iOS' }}
      run: |
        COV_BUILD_PATH=".build"

        PROFILE_FILES=()
        while IFS= read -r -d '' profile; do
          PROFILE_FILES+=("${profile}")
        done < <(find "${COV_BUILD_PATH}" -type f -name 'default.profdata' -print0)

        if [[ ${#PROFILE_FILES[@]} -eq 0 ]]; then
          echo "Could not find SwiftPM coverage profiles under .build" >&2
          exit 1
        fi

        INSTR_PROFILE_PATH="${RUNNER_TEMP}/merged-coverage.profdata"
        echo "Merging ${#PROFILE_FILES[@]} SwiftPM coverage profiles"
        ${LLVM_PROFDATA_CMD} merge -sparse "${PROFILE_FILES[@]}" -o "${INSTR_PROFILE_PATH}"

        COV_BINARIES=()
        while IFS= read -r -d '' test_product; do
          if [[ "${test_product}" == *.xctest && "${{matrix.platform}}" == "macOS" && -d "${test_product}" ]]; then
            test_name="$(basename "${test_product}" .xctest)"
            COV_BINARIES+=("${test_product}/Contents/MacOS/${test_name}")
          else
            COV_BINARIES+=("${test_product}")
          fi
        done < <(find "${COV_BUILD_PATH}" \( -name '*-test-runner' -o -name '*.xctest' \) -print0)

        if [[ ${#COV_BINARIES[@]} -eq 0 ]]; then
          echo "Could not find any SwiftPM test executables under .build" >&2
          exit 1
        fi

        COV_OBJECTS=()
        if [[ "${{matrix.platform}}" == "ubuntu" ]]; then
          while IFS= read -r -d '' object_file; do
            COV_OBJECTS+=("${object_file}")
          done < <(find .build/out/Products -type f \\( -name '*.a' -o -name '*.so' -o -name '*.dylib' \\) -print0)
          echo "Coverage libraries: ${COV_OBJECTS[*]}"
        fi

        LCOV_REPORTS=()
        index=0
        for test_product in "${COV_BINARIES[@]}"; do
          coverage_binary="${test_product}"
          if [[ "${coverage_binary}" == *.xctest && "${{matrix.platform}}" == "macOS" && -d "${coverage_binary}" ]]; then
            test_name="$(basename "${coverage_binary}" .xctest)"
            coverage_binary="${coverage_binary}/Contents/MacOS/${test_name}"
          fi

          report="${RUNNER_TEMP}/coverage-${index}.info"
          echo "Exporting coverage for ${coverage_binary}"
          COV_OBJECT_ARGS=()
          for object_file in "${COV_OBJECTS[@]}"; do
            COV_OBJECT_ARGS+=(-object "${object_file}")
          done
          ${LLVM_COV_CMD} export "${coverage_binary}" "${COV_OBJECT_ARGS[@]}" ${LLVM_COV_ARGS} --instr-profile="${INSTR_PROFILE_PATH}" > "${report}"
          if [[ -s "${report}" ]]; then
            LCOV_REPORTS+=("${report}")
          fi
          index=$((index + 1))
        done

        if [[ ${#LCOV_REPORTS[@]} -eq 0 ]]; then
          echo "llvm-cov produced no coverage reports" >&2
          exit 1
        fi

        LCOV_ARGS=()
        for report in "${LCOV_REPORTS[@]}"; do
          LCOV_ARGS+=(-a "${report}")
        done
        lcov "${LCOV_ARGS[@]}" --ignore-errors empty -o "${OUTPUT_FILE}"
    - name: Generate iOS test coverage report
      if: ${{ matrix.platform == 'iOS' }}
      run: |
        INSTR_PROFILE_PATH="$(find "${DERIVED_DATA_PATH}" -name "*.profdata")"

        # Run llvm-cov for each .xctest bundle found in DerivedData, one per test target
        find "${DERIVED_DATA_PATH}" -name '*.xctest' -print0 | while IFS= read -r -d '' file; do
          FILE_NAME="$(basename "${file}" .xctest)"
          COV_BIN="${file}/${FILE_NAME}"
          ${LLVM_COV_CMD} export "${COV_BIN}" ${LLVM_COV_ARGS} --instr-profile="${INSTR_PROFILE_PATH}" > "${FILE_NAME}.lcov"
        done

        # Combine all .lcov files into a single lcov.info
        find . -maxdepth 1 -name "*.lcov" -exec echo -a {} \; | xargs lcov --ignore-errors empty -o "${OUTPUT_FILE}"
    - name: Normalize file paths in coverage report
      run: |
        sed -i.bak "s|^SF:${GITHUB_WORKSPACE}/|SF:|g" "${OUTPUT_FILE}"
        rm -f "${OUTPUT_FILE}.bak"
    - name: Read minimum test coverage threshhold
      id: read-minimum-coverage
      run: echo "MINIMUM_COVERAGE=$(cat ./.github/minimum_coverage.txt)" >> $GITHUB_ENV
    - name: Enforce minimum test coverage threshhold
      id: enforce-minimum-coverage
      uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
      with:
        path: ${{ env.OUTPUT_FILE }}
        min_coverage: ${{ env.MINIMUM_COVERAGE }}
    - name: Save failed minimum coverage info
      if: ${{ failure() && steps.enforce-minimum-coverage.outcome == 'failure' && steps.read-minimum-coverage.outcome == 'success' }}
      run: echo "failed" > "./${{matrix.platform}}-coverage/${{matrix.platform}}-min-coverage-failed"
    - name: Upload Coverage Information
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.read-minimum-coverage.outcome == 'success' }}
      with:
        name: ${{matrix.platform}}-coverage
        path: ${{matrix.platform}}-coverage/
  build_app:
    name: App Build (${{ matrix.platform }})
    strategy:
      matrix:
        platform:  ['macOS', 'iOS']
      fail-fast: false
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v7
    - name: Configure SwiftLint Reporter
      run: |
        echo "reporter: \"github-actions-logging\"" >> .swiftlint.yml
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.1'
    - name: Build
      uses: sersoft-gmbh/xcodebuild-action@v4
      env:
        SKIP_WARNINGS_SWIFTBEANCOUNT: true
      with:
        project: SwiftBeanCountApp.xcodeproj
        scheme: SwiftBeanCountApp
        destination: ${{ matrix.platform == 'iOS' && 'generic/platform=iOS Simulator' || format('platform={0}', matrix.platform) }}
        action: build
        build-settings: -skipPackagePluginValidation -skipMacroValidation

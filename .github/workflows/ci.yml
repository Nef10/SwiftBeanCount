name: CI

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:
  test:
    name: Package Tests (${{ matrix.platform }}, ${{ matrix.parser }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["macOS", "ubuntu", "iOS"]
        parser: [SwiftParser, RustParser]
        swift: ["6.4.1"]
        include:
          - platform: macOS
            os: macOS-latest
          - platform: ubuntu
            os: ubuntu-24.04
          - platform: iOS
            os: xcode-27
            destination: 'platform=iOS Simulator,OS=27.1,name=iPhone Duo'
            xcode-version: '27.1' # Need to match Xcode version to iOS + Swift version
    runs-on: ${{ matrix.os }}
    env:
      COVERAGE_DIRECTORY: ${{ matrix.platform }}-${{ matrix.parser }}-coverage
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Swift
      if : ${{ matrix.platform != 'iOS' }}
      uses: swift-actions/setup-swift@v3.0.0-beta.1
      with:
        swift-version: "${{ matrix.swift }}"
        skip-verify-signature: ${{ matrix.os == 'ubuntu-24.04' }}
    - name: Setup Xcode
      if : ${{ matrix.platform == 'iOS' }}
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: ${{ matrix.xcode-version }}
    - name: Configure SwiftLint Reporter
      run: 'echo "reporter: \"github-actions-logging\"" >> .swiftlint.yml'
    - name: Install pinned Rust toolchain
      if: ${{ matrix.parser == 'RustParser' }}
      working-directory: Rust/SwiftBeanCountRustLedger
      run: rustc --version
    - name: Rust Tests
      if: ${{ matrix.parser == 'RustParser' }}
      working-directory: Rust/SwiftBeanCountRustLedger
      run: cargo test
    - name: Select simulator architecture
      if: ${{ matrix.platform == 'iOS' }}
      run: |
        case "$(uname -m)" in
          arm64) simulator_triple=aarch64-apple-ios-sim ;;
          x86_64) simulator_triple=x86_64-apple-ios ;;
          *) exit 1 ;;
        esac
        echo "SIMULATOR_TRIPLE=$simulator_triple" >> "$GITHUB_ENV"
        echo "SIMULATOR_ARCH=$(uname -m)" >> "$GITHUB_ENV"
    - name: Install simulator Rust target
      if: ${{ matrix.platform == 'iOS' && matrix.parser == 'RustParser' }}
      working-directory: Rust/SwiftBeanCountRustLedger
      run: rustup target add "$SIMULATOR_TRIPLE"
    - name: Run tests
      if : ${{ matrix.platform != 'iOS' }}
      run: |
        traits=(--disable-default-traits)
        swift_command=(swift)
        if [[ "${{ matrix.parser }}" == RustParser ]]; then
          traits+=(--traits RustLedger)
          swift_command=(python3 Scripts/with-rustledger.py -- swift)
        fi
        for attempt in 1 2; do
          if "${swift_command[@]}" test "${traits[@]}" --enable-code-coverage; then
            break
          fi

          if [[ "$attempt" -eq 1 ]]; then
            echo "${{ matrix.platform }} ${{ matrix.parser }} package tests failed; retrying once..." >&2
          else
            exit 1
          fi
        done
        mkdir -p .build/verification
        if [[ "${{ matrix.parser }}" == SwiftParser ]]; then
          binary_directory=$(swift build "${traits[@]}" --show-bin-path)
          nm -g "$binary_directory/swiftbeancount" > .build/verification/symbols.txt
          if grep -Ei '(uniffi_|rustledger|swiftbeancount_rust_ledger)' .build/verification/symbols.txt; then
            echo 'SwiftParser unexpectedly linked native Rust symbols.' >&2
            exit 1
          fi
        fi
    - name: Create selected iOS package fixture
      if: ${{ matrix.platform == 'iOS' }}
      run: python3 Scripts/create-ios-test-fixture.py --parser "${{ matrix.parser }}"
    - name: Run iOS tests
      id: ios-tests
      if : ${{ matrix.platform == 'iOS' }}
      run: |
        DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData-${{ matrix.parser }}"
        echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"
        workspace="$GITHUB_WORKSPACE/.build/rustledger/ios-fixtures/${{ matrix.parser }}/.swiftpm/xcode/package.xcworkspace"
        mkdir -p .build/verification
        xcode_command=(xcodebuild)
        if [[ "${{ matrix.parser }}" == RustParser ]]; then
          xcode_command=(python3 Scripts/with-rustledger.py --target "$SIMULATOR_TRIPLE" -- xcodebuild)
        fi
        for attempt in 1 2; do
          if "${xcode_command[@]}" test -workspace "$workspace" -scheme SwiftBeanCountAllTests \
            -skipPackagePluginValidation -skipMacroValidation -enableCodeCoverage YES \
            -destination "${{ matrix.destination }}" -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath ".build/verification/ios-$attempt.xcresult" \
            ARCHS="$SIMULATOR_ARCH" CODE_SIGNING_ALLOWED=NO; then
            break
          fi

          if [[ "$attempt" -eq 1 ]]; then
            echo "iOS ${{ matrix.parser }} package tests failed; retrying once..." >&2
          else
            exit 1
          fi
        done
    - name: Upload package verification
      if: ${{ always() && matrix.platform != 'iOS' }}
      uses: actions/upload-artifact@v7
      with:
        name: package-verification-${{ matrix.platform }}-${{ matrix.parser }}
        include-hidden-files: true
        path: .build/verification/
    - name: Upload iOS test results
      if: ${{ always() && matrix.platform == 'iOS' }}
      uses: actions/upload-artifact@v7
      with:
        name: test-results-iOS-${{ matrix.parser }}
        include-hidden-files: true
        path: .build/verification/
    - name: Install lcov
      run: |
        if [[ "${{ matrix.platform }}" == "ubuntu" ]]; then
          sudo apt-get update && sudo apt-get install -y lcov
        else
          brew install lcov
        fi
    - name: Create coverage directory
      run: |
        mkdir -p "${COVERAGE_DIRECTORY}"
    - name: Determine llvm command
      run: |
        if [[ "${{matrix.platform}}" == "iOS" ]]; then
          LLVM_COV_CMD="xcrun llvm-cov"
          LLVM_PROFDATA_CMD="xcrun llvm-profdata"
        else
          # Ask Swift for its toolchain location, even when invoked through a shim.
          SWIFT_RESOURCE_PATH="$(swift -print-target-info | jq -er '.paths.runtimeResourcePath')"
          SWIFT_BIN_PATH="$(dirname "$(dirname "${SWIFT_RESOURCE_PATH}")")/bin"
          LLVM_COV_CMD="${SWIFT_BIN_PATH}/llvm-cov"
          LLVM_PROFDATA_CMD="${SWIFT_BIN_PATH}/llvm-profdata"
          if [[ ! -x "${LLVM_COV_CMD}" || ! -x "${LLVM_PROFDATA_CMD}" ]]; then
            echo "Could not find LLVM coverage tools alongside Swift: ${SWIFT_BIN_PATH}" >&2
            exit 1
          fi
        fi

        echo "Using coverage tool: ${LLVM_COV_CMD}"
        ${LLVM_COV_CMD} --version
        echo "LLVM_COV_CMD=${LLVM_COV_CMD}" >> ${GITHUB_ENV}
        echo "LLVM_PROFDATA_CMD=${LLVM_PROFDATA_CMD}" >> ${GITHUB_ENV}
        ignored_sources='(^|/)(Tests|SourcePackages|DerivedSources|Intermediates\.noindex|checkouts|artifacts|plugins)/|/SwiftBeanCountRustLedgerBindings/'
        # The full SwiftParser backend is inactive when the facade selects RustParser.
        # Its shared fragment helpers remain part of both coverage reports.
        if [[ "${{ matrix.parser }}" == RustParser ]]; then
          ignored_sources+='|/Sources/SwiftBeanCountParser/SwiftParser\.swift$'
        fi
        echo "LLVM_COV_ARGS=--skip-functions --skip-branches --ignore-filename-regex=$ignored_sources --format=lcov" >> "$GITHUB_ENV"
        echo "OUTPUT_FILE=${COVERAGE_DIRECTORY}/${{matrix.platform}}-${{ matrix.parser }}.info" >> ${GITHUB_ENV}
    - name: Generate test coverage report
      run: |
        if [[ "${{matrix.platform}}" == "iOS" ]]; then
          COV_BUILD_PATH="${DERIVED_DATA_PATH}"
          COV_PRODUCTS_PATH="${DERIVED_DATA_PATH}/Build/Products"
        else
          COV_BUILD_PATH=".build"
          COV_PRODUCTS_PATH="${COV_BUILD_PATH}"
        fi

        PROFILE_FILES=()
        while IFS= read -r -d '' profile; do
          PROFILE_FILES+=("${profile}")
        done < <(find "${COV_BUILD_PATH}" -type f -name '*.profdata' -print0)

        if [[ ${#PROFILE_FILES[@]} -eq 0 ]]; then
          echo "Could not find coverage profiles under ${COV_BUILD_PATH}" >&2
          exit 1
        fi

        INSTR_PROFILE_PATH="${RUNNER_TEMP}/merged-coverage.profdata"
        echo "Merging ${#PROFILE_FILES[@]} coverage profiles"
        ${LLVM_PROFDATA_CMD} merge -sparse "${PROFILE_FILES[@]}" -o "${INSTR_PROFILE_PATH}"

        COV_BINARIES=()
        while IFS= read -r -d '' test_product; do
          if [[ "${test_product}" == *.xctest && "${{matrix.platform}}" == "macOS" && -d "${test_product}" ]]; then
            test_name="$(basename "${test_product}" .xctest)"
            COV_BINARIES+=("${test_product}/Contents/MacOS/${test_name}")
          elif [[ "${test_product}" == *.xctest && -d "${test_product}" ]]; then
            test_name="$(basename "${test_product}" .xctest)"
            COV_BINARIES+=("${test_product}/${test_name}")
          else
            COV_BINARIES+=("${test_product}")
          fi
        done < <(find "${COV_PRODUCTS_PATH}" \( -name '*-test-runner' -o -name '*.xctest' \) -print0)

        if [[ ${#COV_BINARIES[@]} -eq 0 ]]; then
          echo "Could not find test executables under ${COV_PRODUCTS_PATH}" >&2
          exit 1
        fi

        COV_OBJECTS=()
        if [[ "${{matrix.platform}}" == "ubuntu" ]]; then
          while IFS= read -r -d '' object_file; do
            COV_OBJECTS+=("${object_file}")
          done < <(find .build/out/Products -type f \( -name '*.a' -o -name '*.so' -o -name '*.dylib' \) -print0)
          echo "Coverage libraries: ${COV_OBJECTS[*]}"
        fi

        LCOV_REPORTS=()
        index=0
        for test_product in "${COV_BINARIES[@]}"; do
          coverage_binary="${test_product}"
          if [[ "${coverage_binary}" == *.xctest && "${{matrix.platform}}" == "macOS" && -d "${coverage_binary}" ]]; then
            test_name="$(basename "${coverage_binary}" .xctest)"
            coverage_binary="${coverage_binary}/Contents/MacOS/${test_name}"
          fi

          report="${RUNNER_TEMP}/coverage-${index}.info"
          echo "Exporting coverage for ${coverage_binary}"
          COV_OBJECT_ARGS=()
          for object_file in "${COV_OBJECTS[@]}"; do
            COV_OBJECT_ARGS+=(-object "${object_file}")
          done
          ${LLVM_COV_CMD} export "${coverage_binary}" "${COV_OBJECT_ARGS[@]}" ${LLVM_COV_ARGS} --instr-profile="${INSTR_PROFILE_PATH}" > "${report}"
          if [[ -s "${report}" ]]; then
            LCOV_REPORTS+=("${report}")
          fi
          index=$((index + 1))
        done

        if [[ ${#LCOV_REPORTS[@]} -eq 0 ]]; then
          echo "llvm-cov produced no coverage reports" >&2
          exit 1
        fi

        LCOV_ARGS=()
        for report in "${LCOV_REPORTS[@]}"; do
          LCOV_ARGS+=(-a "${report}")
        done
        lcov "${LCOV_ARGS[@]}" --ignore-errors empty -o "${OUTPUT_FILE}"
    - name: Normalize file paths in coverage report
      run: |
        sed -i.bak \
          -e "s|^SF:${GITHUB_WORKSPACE}/.build/rustledger/ios-fixtures/${{ matrix.parser }}/|SF:|g" \
          -e "s|^SF:${GITHUB_WORKSPACE}/|SF:|g" "${OUTPUT_FILE}"
        rm -f "${OUTPUT_FILE}.bak"
    - name: Upload parser coverage information
      uses: actions/upload-artifact@v7
      with:
        name: coverage-input-${{ matrix.platform }}-${{ matrix.parser }}
        path: ${{ env.COVERAGE_DIRECTORY }}/
        if-no-files-found: error

  coverage:
    name: Combined Code Coverage
    needs: test
    runs-on: ubuntu-latest
    env:
      COVERAGE_DIRECTORY: combined-coverage
      OUTPUT_FILE: combined-coverage/combined.info
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Download parser and platform coverage reports
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-input-*
        path: coverage-input
        merge-multiple: true
    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov
    - name: Merge parser and platform coverage reports
      id: merge-coverage
      run: |
        mkdir -p "$COVERAGE_DIRECTORY"
        echo "${{ github.event.number }}" > "$COVERAGE_DIRECTORY/PR_NUMBER"
        # Summing execution counts counts each line once, covered by any test run.
        # Require all six inputs so a missing report cannot silently reduce coverage.
        LCOV_ARGS=()
        for platform in macOS ubuntu iOS; do
          for parser in SwiftParser RustParser; do
            LCOV_ARGS+=(-a "coverage-input/$platform-$parser.info")
          done
        done
        lcov "${LCOV_ARGS[@]}" --ignore-errors empty -o "$OUTPUT_FILE"
    - name: Read minimum test coverage threshhold
      id: read-minimum-coverage
      run: echo "MINIMUM_COVERAGE=$(cat ./.github/minimum_coverage.txt)" >> $GITHUB_ENV
    - name: Enforce minimum test coverage threshhold
      id: enforce-minimum-coverage
      uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
      with:
        path: ${{ env.OUTPUT_FILE }}
        min_coverage: ${{ env.MINIMUM_COVERAGE }}
    - name: Save failed minimum coverage info
      if: ${{ failure() && steps.enforce-minimum-coverage.outcome == 'failure' && steps.read-minimum-coverage.outcome == 'success' }}
      run: echo "failed" > "${COVERAGE_DIRECTORY}/combined-min-coverage-failed"
    - name: Upload Coverage Information
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.read-minimum-coverage.outcome == 'success' }}
      with:
        name: combined-coverage
        path: ${{ env.COVERAGE_DIRECTORY }}/
  build_app:
    name: App Build (${{ matrix.platform }}, ${{ matrix.parser }})
    strategy:
      matrix:
        platform:  ['macOS', 'iOS']
        parser: [SwiftParser, RustParser]
      fail-fast: false
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v7
    - name: Configure SwiftLint Reporter
      run: |
        echo "reporter: \"github-actions-logging\"" >> .swiftlint.yml
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.1'
    - name: Install pinned Rust toolchain
      if: ${{ matrix.parser == 'RustParser' }}
      working-directory: Rust/SwiftBeanCountRustLedger
      run: rustc --version
    - name: Install Rust targets
      if: ${{ matrix.parser == 'RustParser' }}
      run: |
        if [[ "${{ matrix.platform }}" == iOS ]]; then
          case "$(uname -m)" in
            arm64) simulator_triple=aarch64-apple-ios-sim ;;
            x86_64) simulator_triple=x86_64-apple-ios ;;
            *) exit 1 ;;
          esac
          (cd Rust/SwiftBeanCountRustLedger && rustup target add aarch64-apple-ios "$simulator_triple")
        fi
    - name: Select app parser
      run: python3 Scripts/create-rustledger-app-project.py --parser "${{ matrix.parser }}"
    - name: Prepare persistent RustLedger artifacts
      if: ${{ matrix.parser == 'RustParser' }}
      run: |
        if [[ "${{ matrix.platform }}" == macOS ]]; then
          python3 Scripts/prepare-rustledger-xcode.py --platform macos
        else
          python3 Scripts/prepare-rustledger-xcode.py --platform ios
        fi
    - name: Build
      env:
        SKIP_WARNINGS_SWIFTBEANCOUNT: true
      run: |
        project=SwiftBeanCountSwiftParserApp.xcodeproj
        if [[ "${{ matrix.parser }}" == RustParser ]]; then
          project=SwiftBeanCountRustLedgerApp.xcodeproj
        fi
        args=(-project "$project" -scheme SwiftBeanCountApp -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO)
        # Match an ordinarily launched Xcode: no wrapper-supplied build environment.
        xcode_command=(env -u PKG_CONFIG_PATH -u SWIFTBEANCOUNT_RUST_BINDINGS xcodebuild)
        if [[ "${{ matrix.platform }}" == macOS ]]; then
          "${xcode_command[@]}" "${args[@]}" -destination 'platform=macOS' -derivedDataPath .build/app-macos build
        else
          "${xcode_command[@]}" "${args[@]}" -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/app-simulator ARCHS="$(uname -m)" build
          "${xcode_command[@]}" "${args[@]}" -destination 'generic/platform=iOS' -derivedDataPath .build/app-device ARCHS=arm64 build
        fi
